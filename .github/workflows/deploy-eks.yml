# Test, build the ITube images (one per microservice + gateway + frontend), push them to ECR and deploy to the EKS dev
# cluster (namespace `itube`). One-time setup (environment `dev`, variable AWS_DEPLOY_ROLE_ARN, secrets): deploy/README.md.
name: Deploy to EKS (dev)

on:
  push:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - gateway/**
      - deploy/k8s/**
      - deploy/k8s-cloudflare/**
      - .github/workflows/deploy-eks.yml
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS IAM role, no long-lived AWS keys
  contents: read

concurrency:
  group: deploy-eks-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  EKS_CLUSTER: eks-lab-dev
  K8S_NAMESPACE: itube
  KUSTOMIZE_VERSION: v5.8.1
  ECR_PREFIX: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab

jobs:
  test:
    name: Tests (unit + BDD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # Every module: unit tests and the Cucumber (BDD) scenarios. They need no external services: in-memory
      # databases (two of them as catalog shards), in-memory engagement stores, mocked neighbour services.
      # The end-to-end journeys (e2e-tests) need a running stack and are skipped here.
      - name: Backend tests
        working-directory: backend
        run: sh ./mvnw -B test

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: backend/*/target/cucumber-report.html
          if-no-files-found: ignore

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vitest run

  images:
    name: Build ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: itube-identity, context: backend, service: identity-service }
          - { image: itube-catalog, context: backend, service: catalog-service }
          - { image: itube-engagement, context: backend, service: engagement-service }
          - { image: itube-payments, context: backend, service: payments-service }
          - { image: itube-transcode-worker, context: backend, service: transcode-worker }
          - { image: itube-gateway, context: gateway, service: "" }
          - { image: itube-frontend, context: frontend, service: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "${AWS_DEPLOY_ROLE_ARN}" ]; then
            echo "::error title=Missing variable::Set the variable AWS_DEPLOY_ROLE_ARN (environment 'dev' or repository). See deploy/README.md."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: itube-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Re-runs of the same commit reuse the image already in ECR (tags are immutable)
      - name: Check for an existing image
        id: existing
        env:
          IMAGE: ${{ env.ECR_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "${IMAGE} already exists, skipping build"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VITE_CDN_BASE_URL=${{ matrix.image == 'itube-frontend' && vars.CLOUDFRONT_BASE_URL || '' }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.ECR_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Required: the deploy role trusts only ...:environment:dev
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ITUBE_DB_PASSWORD: ${{ secrets.ITUBE_DB_PASSWORD }}
          ITUBE_PLAYBACK_SIGNING_KEY: ${{ secrets.ITUBE_PLAYBACK_SIGNING_KEY }}
          ITUBE_JWT_PRIVATE_KEY: ${{ secrets.ITUBE_JWT_PRIVATE_KEY }}
        run: |
          missing=0
          if [ -z "${AWS_DEPLOY_ROLE_ARN}" ]; then
            echo "::error title=Missing variable::Set the variable AWS_DEPLOY_ROLE_ARN (environment 'dev' or repository), e.g. arn:aws:iam::160198385987:role/eks-lab-dev-app-itube. See deploy/README.md."
            missing=1
          fi
          if [ -z "${ITUBE_DB_PASSWORD}" ]; then
            echo "::error title=Missing secret::Set the secret ITUBE_DB_PASSWORD (environment 'dev' or repository). See deploy/README.md."
            missing=1
          fi
          if [ -z "${ITUBE_PLAYBACK_SIGNING_KEY}" ]; then
            echo "::error title=Missing secret::Set the secret ITUBE_PLAYBACK_SIGNING_KEY (32+ random bytes, base64: openssl rand -base64 32). See deploy/README.md."
            missing=1
          elif ! key_bytes=$(set -o pipefail; printf '%s' "${ITUBE_PLAYBACK_SIGNING_KEY}" | base64 -d 2>/dev/null | wc -c) \
               || [ "${key_bytes}" -lt 32 ]; then
            echo "::error title=Invalid secret::ITUBE_PLAYBACK_SIGNING_KEY must be base64 of at least 32 random bytes (openssl rand -base64 32)."
            missing=1
          fi
          # Signs access tokens; identity-service refuses to start without it (docs/AUTH.md)
          if [ -z "${ITUBE_JWT_PRIVATE_KEY}" ]; then
            echo "::error title=Missing secret::Set the secret ITUBE_JWT_PRIVATE_KEY to the output of: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048. See deploy/README.md."
            missing=1
          elif ! printf '%s' "${ITUBE_JWT_PRIVATE_KEY}" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            echo "::error title=Invalid secret::ITUBE_JWT_PRIVATE_KEY must be a PKCS#8 PEM RSA key (-----BEGIN PRIVATE KEY-----), e.g. from openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048."
            missing=1
          fi
          exit "${missing}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: itube-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        id: kubeconfig
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER}"
          kubectl version --client
          # The namespace is created by the infra pipeline; fail early with a clear message if it is missing
          if ! kubectl get namespace "${K8S_NAMESPACE}" >/dev/null 2>&1 \
             && ! kubectl -n "${K8S_NAMESPACE}" get configmaps >/dev/null 2>&1; then
            echo "::error title=Namespace not reachable::Cannot access namespace ${K8S_NAMESPACE} in ${EKS_CLUSTER}. Apply the infra side (namespace + EKS access entry for the deploy role) first."
            exit 1
          fi

      - name: Publish CloudFront assets before rolling out the frontend
        if: vars.CLOUDFRONT_BASE_URL != ''
        env:
          CDN_BASE: ${{ vars.CLOUDFRONT_BASE_URL }}
          ASSETS_BUCKET: ${{ vars.CLOUDFRONT_ASSETS_BUCKET }}
          SIGNING_KEY_ID: ${{ vars.CLOUDFRONT_SIGNING_KEY_ID }}
          CDN_SIGNING_PRIVATE_KEY: ${{ secrets.CLOUDFRONT_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${ASSETS_BUCKET}" && test -n "${SIGNING_KEY_ID}" && test -n "${CDN_SIGNING_PRIVATE_KEY}"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_PREFIX%%/*}"
          image="${ECR_PREFIX}/itube-frontend:${GITHUB_SHA}"
          docker pull "${image}"
          container=$(docker create "${image}")
          trap 'docker rm "${container}" >/dev/null' EXIT
          mkdir -p "${RUNNER_TEMP}/cdn-build"
          docker cp "${container}:/usr/share/nginx/html/." "${RUNNER_TEMP}/cdn-build/"
          # Reusing an image built before CDN activation would silently leave assets on the app origin.
          grep -Fq "${CDN_BASE}/assets/" "${RUNNER_TEMP}/cdn-build/index.html"
          # Retain older hashed assets so open tabs and rollbacks keep working. Never sync --delete.
          aws s3 sync "${RUNNER_TEMP}/cdn-build/assets/" "s3://${ASSETS_BUCKET}/assets/" \
            --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          # Secret travels through env/stdin only, never a file or command argument.
          python -c 'import os,json; print(json.dumps({"apiVersion":"v1","kind":"Secret","metadata":{"name":"itube-cdn-signing","namespace":os.environ["K8S_NAMESPACE"]},"type":"Opaque","stringData":{"private-key":os.environ["CDN_SIGNING_PRIVATE_KEY"]}}))' \
            | kubectl apply -f -
          python - <<'PY'
          import os, pathlib, json
          p = pathlib.Path('deploy/k8s/configmap.yaml')
          text = p.read_text()
          text = text.replace('CDN_MEDIA_BASE_URL: ""', 'CDN_MEDIA_BASE_URL: ' + json.dumps(os.environ['CDN_BASE']))
          text += '\n  CDN_PROVIDER: "cloudfront"\n  CDN_SERVE_VIDEO: "true"\n'
          text += '  CDN_SIGNING_KEY_ID: ' + json.dumps(os.environ['SIGNING_KEY_ID']) + '\n'
          p.write_text(text)
          patch = {"apiVersion": "apps/v1", "kind": "Deployment", "metadata": {"name": "catalog"},
                   "spec": {"template": {"metadata": {"annotations": {
                     "itube/cdn-config": os.environ['CDN_BASE'] + '|' + os.environ['SIGNING_KEY_ID']}}}}}
          pathlib.Path('deploy/k8s/cdn-config-patch.json').write_text(json.dumps(patch))
          PY

      - name: Create or update Secrets
        id: secret
        env:
          ITUBE_DB_PASSWORD: ${{ secrets.ITUBE_DB_PASSWORD }}
          ITUBE_PLAYBACK_SIGNING_KEY: ${{ secrets.ITUBE_PLAYBACK_SIGNING_KEY }}
          ITUBE_STRIPE_SECRET_KEY: ${{ secrets.ITUBE_STRIPE_SECRET_KEY }}
          ITUBE_STRIPE_WEBHOOK_SECRET: ${{ secrets.ITUBE_STRIPE_WEBHOOK_SECRET }}
          ITUBE_INTERNAL_API_TOKEN: ${{ secrets.ITUBE_INTERNAL_API_TOKEN }}
          ITUBE_JWT_PRIVATE_KEY: ${{ secrets.ITUBE_JWT_PRIVATE_KEY }}
          ITUBE_JWT_PREVIOUS_PUBLIC_KEY: ${{ secrets.ITUBE_JWT_PREVIOUS_PUBLIC_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          # Values go through files (mode 600), never through command-line arguments or the log
          secret_dir="$(mktemp -d "${RUNNER_TEMP}/itube-secrets.XXXXXX")"
          tunnel_dir="$(mktemp -d "${RUNNER_TEMP}/cloudflare-tunnel.XXXXXX")"
          trap 'rm -rf "${secret_dir}" "${tunnel_dir}"' EXIT
          umask 077
          printf '%s' "${ITUBE_DB_PASSWORD}" > "${secret_dir}/db-password"
          printf '%s' "${ITUBE_PLAYBACK_SIGNING_KEY}" > "${secret_dir}/playback-signing-key"
          printf '%s' "${ITUBE_JWT_PRIVATE_KEY}" > "${secret_dir}/jwt-private-key"
          # No object storage keys: catalog-service and transcode-worker reach S3 with their EKS Pod Identity role
          # Optional values: only added when set (the Deployments reference them with optional: true)
          if [ -n "${ITUBE_STRIPE_SECRET_KEY}" ]; then
            printf '%s' "${ITUBE_STRIPE_SECRET_KEY}" > "${secret_dir}/stripe-secret-key"
          fi
          if [ -n "${ITUBE_STRIPE_WEBHOOK_SECRET}" ]; then
            printf '%s' "${ITUBE_STRIPE_WEBHOOK_SECRET}" > "${secret_dir}/stripe-webhook-secret"
          fi
          # Only during a signing-key rotation (deploy/README.md)
          if [ -n "${ITUBE_JWT_PREVIOUS_PUBLIC_KEY}" ]; then
            printf '%s' "${ITUBE_JWT_PREVIOUS_PUBLIC_KEY}" > "${secret_dir}/jwt-previous-public-key"
          fi
          if [ -n "${ITUBE_INTERNAL_API_TOKEN}" ]; then
            printf '%s' "${ITUBE_INTERNAL_API_TOKEN}" > "${secret_dir}/internal-api-token"
          else
            echo "::warning title=No internal API token::Set the secret ITUBE_INTERNAL_API_TOKEN (openssl rand -base64 32) so services check each other's calls to /internal/** (deploy/README.md)."
          fi
          result="$(kubectl create secret generic itube-secrets \
              --namespace "${K8S_NAMESPACE}" \
              --from-file="${secret_dir}" \
              --dry-run=client -o yaml \
            | kubectl apply -f -)"
          echo "${result}"
          changed=false
          # New deployments already read a newly created Secret. Restart only existing consumers.
          if printf '%s' "${result}" | grep -qE ' configured$'; then changed=true; fi

          # Cloudflare Tunnel (deploy/cloudflare): publish the app only when the token is configured
          if [ -n "${CLOUDFLARE_TUNNEL_TOKEN}" ]; then
            printf '%s' "${CLOUDFLARE_TUNNEL_TOKEN}" > "${tunnel_dir}/token"
            kubectl create secret generic cloudflare-tunnel --namespace "${K8S_NAMESPACE}" \
              --from-file="${tunnel_dir}" --dry-run=client -o yaml | kubectl apply -f -
            echo "overlay=deploy/k8s-cloudflare" >> "${GITHUB_OUTPUT}"
          else
            echo "No CLOUDFLARE_TUNNEL_TOKEN: deploying without a public endpoint (port-forward only)"
            echo "overlay=deploy/k8s" >> "${GITHUB_OUTPUT}"
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Install kustomize
        run: |
          if command -v kustomize >/dev/null 2>&1; then
            kustomize version
            exit 0
          fi
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "${url}" | tar -xz -C "${RUNNER_TEMP}/bin" kustomize
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/kustomize" version

      - name: Set image tags
        working-directory: deploy/k8s
        run: |
          args=()
          for image in itube-identity itube-catalog itube-engagement itube-payments itube-transcode-worker itube-gateway itube-frontend; do
            args+=("${image}=${ECR_PREFIX}/${image}:${GITHUB_SHA}")
          done
          kustomize edit set image "${args[@]}"
          if [ -f cdn-config-patch.json ]; then kustomize edit add patch --path cdn-config-patch.json; fi
          kustomize build . | grep -E '^\s+image:' | sort -u

      - name: Apply manifests
        env:
          OVERLAY: ${{ steps.secret.outputs.overlay }}
          SECRET_CHANGED: ${{ steps.secret.outputs.changed }}
        run: |
          set -euo pipefail
          kubectl apply -k "${OVERLAY}"
          # The single-replica monolith from before the microservices split
          kubectl -n "${K8S_NAMESPACE}" delete deployment/backend service/backend --ignore-not-found
          # Pods read Secrets only at start-up: restart the services when it changed
          if [ "${SECRET_CHANGED}" = "true" ]; then
            echo "Secret itube-secrets changed, restarting the services"
            # Limit surge capacity on the two-node dev cluster during secret rotation.
            for deploy in identity catalog engagement payments transcode-worker; do
              kubectl -n "${K8S_NAMESPACE}" rollout restart "deployment/${deploy}"
              kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/${deploy}" --timeout=600s
            done
          fi

      - name: Wait for rollout
        env:
          OVERLAY: ${{ steps.secret.outputs.overlay }}
        run: |
          set -euo pipefail
          ns="${K8S_NAMESPACE}"
          for sts in postgres postgres-shard1 scylla kafka; do
            kubectl -n "${ns}" rollout status "statefulset/${sts}" --timeout=300s
          done
          kubectl -n "${ns}" rollout status deployment/redis --timeout=180s
          for deploy in identity catalog engagement payments transcode-worker gateway frontend; do
            kubectl -n "${ns}" rollout status "deployment/${deploy}" --timeout=600s
          done
          if [ "${OVERLAY}" = "deploy/k8s-cloudflare" ]; then
            kubectl -n "${ns}" rollout status deployment/cloudflared --timeout=180s
          fi
          kubectl -n "${ns}" get pods,svc,pvc,hpa -o wide

      - name: Debug information
        if: failure() && steps.kubeconfig.outcome == 'success'
        run: |
          ns="${K8S_NAMESPACE}"
          echo "::group::Pods / Services / PVCs / HPAs"
          kubectl -n "${ns}" get pods,svc,pvc,hpa -o wide || true
          echo "::endgroup::"
          echo "::group::Recent events"
          kubectl -n "${ns}" get events --sort-by=.lastTimestamp | tail -n 60 || true
          echo "::endgroup::"
          for pod in $(kubectl -n "${ns}" get pods -o name 2>/dev/null); do
            echo "::group::describe ${pod}"
            kubectl -n "${ns}" describe "${pod}" || true
            echo "::endgroup::"
            echo "::group::logs ${pod}"
            kubectl -n "${ns}" logs "${pod}" --all-containers --tail=150 || true
            kubectl -n "${ns}" logs "${pod}" --all-containers --previous --tail=80 2>/dev/null || true
            echo "::endgroup::"
          done

      - name: Job summary
        if: success()
        env:
          OVERLAY: ${{ steps.secret.outputs.overlay }}
        run: |
          {
            echo "## ITube deployed to \`${EKS_CLUSTER}\` (namespace \`${K8S_NAMESPACE}\`)"
            echo ""
            echo "Images: \`${ECR_PREFIX}/<service>:${GITHUB_SHA}\` for identity, catalog, engagement, payments,"
            echo "transcode-worker, gateway and frontend."
            echo ""
            if [ "${OVERLAY}" = "deploy/k8s-cloudflare" ]; then
              echo "Public through Cloudflare Tunnel: see \`terraform output app_url\` in deploy/cloudflare."
            else
              echo "No public endpoint (no Cloudflare tunnel token). Open the app with:"
              echo ""
              echo '```bash'
              echo "aws eks update-kubeconfig --region ${AWS_REGION} --name ${EKS_CLUSTER}"
              echo "kubectl port-forward -n ${K8S_NAMESPACE} svc/frontend 3000:80"
              echo "# then browse http://localhost:3000"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
