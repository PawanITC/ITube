# Build the ITube images, push them to ECR and deploy to the EKS dev cluster (namespace `itube`).
# One-time setup (environment `dev`, variable AWS_DEPLOY_ROLE_ARN, secrets): see deploy/README.md.
name: Deploy to EKS (dev)

on:
  push:
    branches: [master]
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - .github/workflows/deploy-eks.yml
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS IAM role, no long-lived AWS keys
  contents: read

concurrency:
  group: deploy-eks-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  EKS_CLUSTER: eks-lab-dev
  K8S_NAMESPACE: itube
  KUSTOMIZE_VERSION: v5.8.1

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # The tests need no external services: HistoryApiTests uses the in-memory `h2` profile,
      # the payment tests use fakes.
      - name: Backend tests
        working-directory: backend
        run: sh ./mvnw -B test

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vitest run

  deploy:
    name: Build, push and deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Required: the deploy role trusts only ...:environment:dev
    environment: dev
    # ECR repositories created by the infra repo; tag = commit SHA
    env:
      BACKEND_IMAGE: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab/itube-backend:${{ github.sha }}
      FRONTEND_IMAGE: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab/itube-frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ITUBE_DB_PASSWORD: ${{ secrets.ITUBE_DB_PASSWORD }}
          ITUBE_PLAYBACK_SIGNING_KEY: ${{ secrets.ITUBE_PLAYBACK_SIGNING_KEY }}
        run: |
          missing=0
          if [ -z "${AWS_DEPLOY_ROLE_ARN}" ]; then
            echo "::error title=Missing variable::Set the variable AWS_DEPLOY_ROLE_ARN (environment 'dev' or repository), e.g. arn:aws:iam::160198385987:role/eks-lab-dev-app-itube. See deploy/README.md."
            missing=1
          fi
          if [ -z "${ITUBE_DB_PASSWORD}" ]; then
            echo "::error title=Missing secret::Set the secret ITUBE_DB_PASSWORD (environment 'dev' or repository). See deploy/README.md."
            missing=1
          fi
          if [ -z "${ITUBE_PLAYBACK_SIGNING_KEY}" ]; then
            echo "::error title=Missing secret::Set the secret ITUBE_PLAYBACK_SIGNING_KEY (32+ random bytes, base64: openssl rand -base64 32). See deploy/README.md."
            missing=1
          elif ! key_bytes=$(set -o pipefail; printf '%s' "${ITUBE_PLAYBACK_SIGNING_KEY}" | base64 -d 2>/dev/null | wc -c) \
               || [ "${key_bytes}" -lt 32 ]; then
            echo "::error title=Invalid secret::ITUBE_PLAYBACK_SIGNING_KEY must be base64 of at least 32 random bytes (openssl rand -base64 32)."
            missing=1
          fi
          exit "${missing}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: itube-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Re-runs of the same commit reuse the images already in ECR (also safe with immutable tags)
      - name: Check for existing images
        id: existing
        run: |
          for name in backend frontend; do
            if [ "${name}" = backend ]; then image="${BACKEND_IMAGE}"; else image="${FRONTEND_IMAGE}"; fi
            if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
              echo "${image} already exists, skipping build"
              echo "${name}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${name}=false" >> "${GITHUB_OUTPUT}"
            fi
          done

      - name: Build and push backend image
        if: steps.existing.outputs.backend != 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha,scope=itube-backend
          cache-to: type=gha,scope=itube-backend,mode=max

      - name: Build and push frontend image
        if: steps.existing.outputs.frontend != 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha,scope=itube-frontend
          cache-to: type=gha,scope=itube-frontend,mode=max

      - name: Configure kubectl
        id: kubeconfig
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER}"
          kubectl version --client
          # The namespace is created by the infra pipeline; fail early with a clear message if it is missing
          if ! kubectl get namespace "${K8S_NAMESPACE}" >/dev/null 2>&1 \
             && ! kubectl -n "${K8S_NAMESPACE}" get configmaps >/dev/null 2>&1; then
            echo "::error title=Namespace not reachable::Cannot access namespace ${K8S_NAMESPACE} in ${EKS_CLUSTER}. Apply the infra side (namespace + EKS access entry for the deploy role) first."
            exit 1
          fi

      - name: Create or update Secret itube-secrets
        id: secret
        env:
          ITUBE_DB_PASSWORD: ${{ secrets.ITUBE_DB_PASSWORD }}
          ITUBE_PLAYBACK_SIGNING_KEY: ${{ secrets.ITUBE_PLAYBACK_SIGNING_KEY }}
          ITUBE_STRIPE_SECRET_KEY: ${{ secrets.ITUBE_STRIPE_SECRET_KEY }}
          ITUBE_STRIPE_WEBHOOK_SECRET: ${{ secrets.ITUBE_STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # Values go through files (mode 600), never through command-line arguments or the log
          secret_dir="$(mktemp -d "${RUNNER_TEMP}/itube-secrets.XXXXXX")"
          trap 'rm -rf "${secret_dir}"' EXIT
          umask 077
          printf '%s' "${ITUBE_DB_PASSWORD}" > "${secret_dir}/db-password"
          printf '%s' "${ITUBE_PLAYBACK_SIGNING_KEY}" > "${secret_dir}/playback-signing-key"
          # Optional Stripe keys: only added when set (the Deployment references them with optional: true)
          if [ -n "${ITUBE_STRIPE_SECRET_KEY}" ]; then
            printf '%s' "${ITUBE_STRIPE_SECRET_KEY}" > "${secret_dir}/stripe-secret-key"
          fi
          if [ -n "${ITUBE_STRIPE_WEBHOOK_SECRET}" ]; then
            printf '%s' "${ITUBE_STRIPE_WEBHOOK_SECRET}" > "${secret_dir}/stripe-webhook-secret"
          fi
          result="$(kubectl create secret generic itube-secrets \
              --namespace "${K8S_NAMESPACE}" \
              --from-file="${secret_dir}" \
              --dry-run=client -o yaml \
            | kubectl apply -f -)"
          echo "${result}"
          if printf '%s' "${result}" | grep -qE ' (configured|created)$'; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install kustomize
        run: |
          if command -v kustomize >/dev/null 2>&1; then
            kustomize version
            exit 0
          fi
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "${url}" | tar -xz -C "${RUNNER_TEMP}/bin" kustomize
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/kustomize" version

      - name: Set image tags
        working-directory: deploy/k8s
        run: |
          kustomize edit set image "itube-backend=${BACKEND_IMAGE}" "itube-frontend=${FRONTEND_IMAGE}"
          kustomize build . | grep -E '^\s+image:' | sort -u

      - name: Apply manifests
        env:
          SECRET_CHANGED: ${{ steps.secret.outputs.changed }}
        run: |
          set -euo pipefail
          kubectl apply -k deploy/k8s
          # Pods read the Secret only at start-up: restart the backend when it changed
          if [ "${SECRET_CHANGED}" = "true" ]; then
            echo "Secret itube-secrets changed, restarting the backend"
            kubectl -n "${K8S_NAMESPACE}" rollout restart deployment/backend
          fi

      - name: Wait for rollout
        run: |
          set -euo pipefail
          kubectl -n "${K8S_NAMESPACE}" rollout status statefulset/postgres --timeout=300s
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/redis --timeout=180s
          kubectl -n "${K8S_NAMESPACE}" rollout status statefulset/kafka --timeout=300s
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/backend --timeout=600s
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/frontend --timeout=180s
          kubectl -n "${K8S_NAMESPACE}" get pods,svc,pvc -o wide

      - name: Debug information
        if: failure() && steps.kubeconfig.outcome == 'success'
        run: |
          ns="${K8S_NAMESPACE}"
          echo "::group::Pods / Services / PVCs"
          kubectl -n "${ns}" get pods,svc,pvc -o wide || true
          echo "::endgroup::"
          echo "::group::Recent events"
          kubectl -n "${ns}" get events --sort-by=.lastTimestamp | tail -n 60 || true
          echo "::endgroup::"
          for pod in $(kubectl -n "${ns}" get pods -o name 2>/dev/null); do
            echo "::group::describe ${pod}"
            kubectl -n "${ns}" describe "${pod}" || true
            echo "::endgroup::"
            echo "::group::logs ${pod}"
            kubectl -n "${ns}" logs "${pod}" --all-containers --tail=150 || true
            kubectl -n "${ns}" logs "${pod}" --all-containers --previous --tail=80 2>/dev/null || true
            echo "::endgroup::"
          done

      - name: Job summary
        if: success()
        run: |
          {
            echo "## ITube deployed to \`${EKS_CLUSTER}\` (namespace \`${K8S_NAMESPACE}\`)"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| backend | \`${BACKEND_IMAGE}\` |"
            echo "| frontend | \`${FRONTEND_IMAGE}\` |"
            echo ""
            echo "Open the app (no public endpoint, by design):"
            echo ""
            echo '```bash'
            echo "aws eks update-kubeconfig --region ${AWS_REGION} --name ${EKS_CLUSTER}"
            echo "kubectl port-forward -n ${K8S_NAMESPACE} svc/frontend 3000:80"
            echo "# then browse http://localhost:3000"
            echo ""
            echo "# Swagger UI: http://localhost:8080/swagger-ui.html"
            echo "kubectl port-forward -n ${K8S_NAMESPACE} svc/backend 8080:8080"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
