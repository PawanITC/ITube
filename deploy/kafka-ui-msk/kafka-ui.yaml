apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-ui
  namespace: itube
  labels:
    app.kubernetes.io/name: kafka-ui-msk
    app.kubernetes.io/part-of: itube
# EKS Pod Identity uses the association in infra/envs/dev/msk.tf, not an IRSA role-arn annotation.
# Its webhook mounts its own AWS token, independent of the default Kubernetes API token.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui-msk
  namespace: itube
  labels:
    app.kubernetes.io/name: kafka-ui-msk
    app.kubernetes.io/part-of: itube
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui-msk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui-msk
        app.kubernetes.io/part-of: itube
    spec:
      serviceAccountName: kafka-ui
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # Matches the existing Kafbat image's non-root user/group.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-ui
          # Same pinned image as the existing local Docker Kafka UI; includes the AWS MSK IAM plugin.
          image: ghcr.io/kafbat/kafka-ui:v1.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/kafka-ui/application-msk.yaml
            - name: MSK_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-ui-msk-config
                  key: bootstrap-servers
            - name: AWS_REGION
              value: eu-west-2
            - name: AWS_DEFAULT_REGION
              value: eu-west-2
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: JAVA_OPTS
              value: -Xms128m -Xmx384m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 768Mi
              ephemeral-storage: 128Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/kafka-ui
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kafka-ui-msk-config
            items:
              - key: application-msk.yaml
                path: application-msk.yaml
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-msk
  namespace: itube
  labels:
    app.kubernetes.io/name: kafka-ui-msk
    app.kubernetes.io/part-of: itube
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka-ui-msk
  ports:
    - name: http
      port: 8080
      targetPort: http
