# ITube on a local Kubernetes (Docker Desktop): everything in deploy/k8s, with SeaweedFS instead of S3.
# Build the images with the tag `local` first, e.g.:
#   docker build --build-arg SERVICE=catalog-service -t itube-catalog:local backend
#   docker build -t itube-gateway:local gateway
# The Secret itube-secrets needs db-password, playback-signing-key, storage-secret-key (SeaweedFS) and
# jwt-private-key (openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
  # Local stand-in for S3. The Secret itube-secrets needs a `storage-secret-key` entry for it.
  - seaweedfs.yaml
# The base has already renamed the images to their ECR names, so match on those.
images:
  - name: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab/itube-identity
    newName: itube-identity
    newTag: local
  - name: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab/itube-catalog
    newName: itube-catalog
    newTag: local
  - name: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab/itube-engagement
    newName: itube-engagement
    newTag: local
  - name: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab/itube-payments
    newName: itube-payments
    newTag: local
  - name: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab/itube-transcode-worker
    newName: itube-transcode-worker
    newTag: local
  - name: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab/itube-gateway
    newName: itube-gateway
    newTag: local
  - name: 160198385987.dkr.ecr.eu-west-2.amazonaws.com/eks-lab/itube-frontend
    newName: itube-frontend
    newTag: local
patches:
  - target: { kind: ConfigMap, name: itube-config }
    patch: |
      - op: replace
        path: /data/FRONTEND_BASE_URL
        value: http://localhost:3000
      # No OpenTelemetry backend in this cluster (on EKS it comes from deploy/terraform/observability.tf):
      # switch the three OTLP exporters off so the services don't log connection errors
      - op: add
        path: /data/MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
        value: "false"
      - op: add
        path: /data/MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
        value: "false"
      - op: add
        path: /data/MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED
        value: "false"
  - target: { kind: StatefulSet }
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: hostpath
  # The base reaches AWS S3 through EKS Pod Identity; locally the media services use SeaweedFS with static keys
  - target: { kind: Deployment, name: catalog }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog
      spec:
        template:
          spec:
            initContainers:
              - name: wait-for-dependencies
                command:
                  - bash
                  - -c
                  - |
                    for target in postgres:5432 postgres-shard1:5432 seaweedfs:8333 redis:6379 kafka:9092; do
                      host="${target%%:*}"; port="${target##*:}"
                      until (exec 3<>"/dev/tcp/${host}/${port}") 2>/dev/null; do
                        echo "waiting for ${target} ..."; sleep 3
                      done
                      echo "${target} is reachable"
                    done
            containers:
              - name: catalog
                env:
                  - name: STORAGE_BUCKET
                    value: itube-media
                  - name: STORAGE_REGION
                    value: us-east-1
                  - name: STORAGE_ENDPOINT
                    value: http://seaweedfs:8333
                  - name: STORAGE_ACCESS_KEY
                    value: itube
                  - name: STORAGE_SECRET_KEY
                    value: null # drop the base's empty value; the key comes from the Secret
                    valueFrom:
                      secretKeyRef:
                        name: itube-secrets
                        key: storage-secret-key
                  - name: STORAGE_PATH_STYLE
                    value: "true"
                  - name: STORAGE_CREATE_BUCKET
                    value: "true"
                  # Browsers can't follow a pre-signed URL to http://seaweedfs:8333: stream through the service
                  - name: STORAGE_REDIRECT_PLAYBACK
                    value: "false"
  - target: { kind: Deployment, name: transcode-worker }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: transcode-worker
      spec:
        template:
          spec:
            containers:
              - name: transcode-worker
                env:
                  - name: STORAGE_BUCKET
                    value: itube-media
                  - name: STORAGE_REGION
                    value: us-east-1
                  - name: STORAGE_ENDPOINT
                    value: http://seaweedfs:8333
                  - name: STORAGE_ACCESS_KEY
                    value: itube
                  - name: STORAGE_SECRET_KEY
                    value: null
                    valueFrom:
                      secretKeyRef:
                        name: itube-secrets
                        key: storage-secret-key
                  - name: STORAGE_PATH_STYLE
                    value: "true"
