# Kafka 4.0, single node in KRaft mode (broker + controller), same settings as docker-compose.yml.
# Carries the transcode jobs and the base64 renditions (records up to 100 MB).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None # headless: governing Service of the StatefulSet; clients use kafka:9092
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      automountServiceAccountToken: false
      # Required: otherwise Kubernetes injects KAFKA_PORT=tcp://..., KAFKA_SERVICE_HOST, ... for the
      # `kafka` Service, and the apache/kafka image turns every KAFKA_* variable into a broker property.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        # apache/kafka runs as `appuser` (UID/GID 1000); fsGroup makes the EBS volume writable for it
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            # Fixed cluster id. The image's start script runs `kafka-storage format` on every start and
            # tolerates "already formatted": a fresh PVC gets formatted, a restart keeps its data.
            # Never change this value while the PVC exists (the broker would refuse to start).
            - name: CLUSTER_ID
              value: WiIR_6s3QYilccdMgiOcRA
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Data in a subdirectory: the root of a fresh EBS volume contains lost+found, which Kafka
            # would reject as an invalid partition directory
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/kraft-combined-logs
            # Renditions are sent as base64 JSON records of up to 100 MB
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "104857600"
            - name: KAFKA_REPLICA_FETCH_MAX_BYTES
              value: "104857600"
            - name: KAFKA_SOCKET_REQUEST_MAX_BYTES
              value: "125829120"
            # Keep the 5Gi volume from filling up with old renditions (5 topics x 3 partitions)
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "536870912"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "134217728"
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: kafka
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 5Gi
