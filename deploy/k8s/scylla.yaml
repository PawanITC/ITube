# ScyllaDB: engagement data (watch history, likes, comments). The backend creates the keyspace and tables
# on startup (backend/src/main/resources/scylla/engagement.cql).
# Dev cluster: one node in developer mode with replication factor 1. For production run at least three
# nodes (e.g. with the Scylla Operator) and set ITUBE_SCYLLA_REPLICATION to replication_factor 3.
apiVersion: v1
kind: Service
metadata:
  name: scylla
  labels:
    app.kubernetes.io/name: scylla
spec:
  clusterIP: None # headless: governing Service of the StatefulSet
  selector:
    app.kubernetes.io/name: scylla
  ports:
    - name: cql
      port: 9042
      targetPort: cql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scylla
  labels:
    app.kubernetes.io/name: scylla
spec:
  serviceName: scylla
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scylla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scylla
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      # The image's supervisord starts as root and drops to the `scylla` user itself, so no runAsNonRoot here
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scylla
          image: scylladb/scylla:6.2
          imagePullPolicy: IfNotPresent
          args:
            - --smp
            - "1"
            - --memory
            - 1G
            # Seastar holds back ~1.5 GiB for the OS by default, leaving <1G under the 2Gi limit, so it refuses to
            # start ("insufficient physical memory"). 512M covers the container's other processes.
            - --reserve-memory
            - 512M
            - --overprovisioned
            - "1"
            - --developer-mode
            - "1"
          ports:
            - name: cql
              containerPort: 9042
          readinessProbe:
            tcpSocket:
              port: cql
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: cql
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/scylla
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: scylla
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 20Gi
