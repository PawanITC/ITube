# catalog-service and transcode-worker read and write the media bucket. EKS Pod Identity maps this ServiceAccount to
# the bucket's IAM role (deploy/terraform/storage.tf), so no S3 keys are stored anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend # must match backend_service_account in deploy/terraform/variables.tf
  labels:
    app.kubernetes.io/name: backend
# The services never call the Kubernetes API. Pod Identity mounts its own token, independent of this setting.
automountServiceAccountToken: false
