# SeaweedFS (all-in-one: master, volume, filer and S3 gateway): S3-compatible storage for video files,
# renditions and thumbnails. The backend creates the bucket.
# Dev cluster only. On AWS, use an S3 bucket (with CloudFront in front) instead: point STORAGE_ENDPOINT at
# S3, clear the access keys so the pod role is used, and turn ITUBE_STORAGE_REDIRECT_PLAYBACK back on.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  clusterIP: None # headless: governing Service of the StatefulSet
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image runs as root and has no fixed non-root user, so no runAsNonRoot here
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.51
          imagePullPolicy: IfNotPresent
          # Subdirectory, because the root of a fresh EBS volume contains lost+found
          args:
            - server
            - -dir=/data/seaweedfs
            - -s3
            - -s3.port=8333
            - -master.volumeSizeLimitMB=1024
            - -volume.max=0
          env:
            # Admin S3 credentials (used when no S3 config file is given); must match the backend's
            - name: AWS_ACCESS_KEY_ID
              value: itube
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: itube-secrets
                  key: storage-secret-key
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: seaweedfs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
