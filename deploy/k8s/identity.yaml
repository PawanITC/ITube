# identity-service: accounts, register/login/logout. Postgres schema "identity".
apiVersion: v1
kind: Service
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
spec:
  selector:
    app.kubernetes.io/name: identity
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
spec:
  # Starting size; the HorizontalPodAutoscaler below adjusts it
  replicas: 2
  revisionHistoryLimit: 5
  # Zero-downtime deploys: start a new pod, wait until it is ready, only then stop an old one
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      # Spread replicas over nodes and zones, so losing one node never takes the service down
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: identity
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for the dependencies instead of crash-looping while they start (same image, bash /dev/tcp)
        - name: wait-for-dependencies
          image: itube-identity
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              for target in postgres:5432 redis:6379 kafka:9092; do
                host="${target%%:*}"; port="${target##*:}"
                until (exec 3<>"/dev/tcp/${host}/${port}") 2>/dev/null; do
                  echo "waiting for ${target} ..."; sleep 3
                done
                echo "${target} is reachable"
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: identity
          image: itube-identity
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Shared settings: Redis, Kafka, the other services' URLs, CDN (configmap.yaml)
          envFrom:
            - configMapRef:
                name: itube-config
            # Cognito sign-in settings, created by deploy/terraform (cognito.tf). Without it Cognito is off.
            - configMapRef:
                name: itube-cognito
                optional: true
          env:
            # RSA key that signs access tokens (docs/AUTH.md). Every replica needs the same key, so a missing one
            # stops start-up instead of each pod making up its own.
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: itube-secrets
                  key: jwt-private-key
            - name: JWT_REQUIRE_CONFIGURED_KEY
              value: "true"
            # Public key of the previous signing key, during a key rotation only
            - name: JWT_PREVIOUS_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: itube-secrets
                  key: jwt-previous-public-key
                  optional: true
            - name: IDENTITY_DATABASE_URL
              value: jdbc:postgresql://postgres:5432/itube
            - name: DATABASE_USERNAME
              value: itube
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itube-secrets
                  key: db-password
            # Shared secret for /internal/** calls between services (optional; see deploy/README.md)
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: itube-secrets
                  key: internal-api-token
                  optional: true
            # No OpenTelemetry collector in this cluster: switch the three OTLP exporters off (deploy/README.md)
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
            - name: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
              value: "false"
            - name: MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED
              value: "false"
          # Give the Service time to stop routing here before shutdown starts, so deploys drop no requests
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60 # up to ~5 minutes for the first start (schema init, Kafka topics)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            # Heap = 75% of the limit (JAVA_TOOL_OPTIONS in the image)
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
# Adds pods when average CPU passes 70% of the request and removes them when load drops (needs metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Scale down slowly, so a short dip doesn't remove capacity that is needed again a minute later
      stabilizationWindowSeconds: 300
---
# Node upgrades and drains may never take more than one replica away at a time
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
