openapi: 3.1.0
info:
  title: ITube API
  version: 0.1.0
  description: |
    REST API for the ITube video platform (Spring Boot backend).
    This file is the single source of truth for the API contract until the backend
    generates its own spec. Add each new endpoint here as it is built.
servers:
  - url: /api
    description: Local dev (Vite proxies /api to http://localhost:8080)
tags:
  - name: Videos
    description: Browsing and searching videos
paths:
  /videos:
    get:
      tags: [Videos]
      summary: List videos
      description: Returns video metadata, including transcoding status.
      responses:
        '200':
          description: A list of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
  /videos/{videoId}/qualities:
    get:
      tags: [Videos]
      summary: List available video qualities
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Available rendition names; empty while processing.
          content:
            application/json:
              schema:
                type: array
                items: { type: string, enum: [360p, 720p] }
  /videos/{videoId}/renditions/{quality}:
    get:
      tags: [Videos]
      summary: Get a transcoded MP4 rendition
      parameters:
        - $ref: '#/components/parameters/VideoId'
        - name: quality
          in: path
          required: true
          schema: { type: string, enum: [360p, 720p] }
      responses:
        '200':
          description: MP4 video data
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '404': { description: Video or rendition not found }
components:
  parameters:
    VideoId:
      name: videoId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    Video:
      type: object
      required: [videoId, title, channelName, processingStatus]
      properties:
        videoId: { type: integer, format: int64 }
        channelId: { type: integer, format: int64 }
        title:
          type: string
        channelName:
          type: string
        duration:
          type: string
          example: "00:24:16"
        processingStatus:
          type: string
          enum: [PROCESSING, READY, FAILED]
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
