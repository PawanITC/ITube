# ITube frontend server (nginx-unprivileged listens on 8080 as UID 101).
# /api/ goes to the backend Service, exactly like the Vite dev proxy in vite.config.js.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Video uploads are up to 500 MB (spring.servlet.multipart.max-request-size=501MB)
    client_max_body_size 501m;

    # Lightweight probe endpoint for Kubernetes (does not touch the backend)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # $http_host keeps the port the browser used (localhost:3000 through port-forward)
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Video streaming: forward Range requests and stream the 206 responses straight through
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;

        # Big uploads: stream the request body to the backend instead of spooling it to disk first
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
        send_timeout          900s;
    }

    # Hashed Vite assets never change, cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes are served index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
