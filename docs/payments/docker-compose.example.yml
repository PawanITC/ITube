# Local infrastructure for development, as an alternative to tf_docker/ (Terraform).
# Uses the same ports and credentials the backend expects by default.
#
#   docker compose --env-file backend/.env -f docs/payments/docker-compose.example.yml up -d
#
# The stripe-cli service forwards Stripe webhooks to the backend running on your machine.
# --env-file lets Compose substitute STRIPE_SECRET_KEY from backend/.env (never committed).
# Get the webhook secret with: docker compose -f docs/payments/docker-compose.example.yml logs stripe-cli
name: itube-payments

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: itube
      POSTGRES_USER: itube
      POSTGRES_PASSWORD: itube-dev-password
    ports: ["5434:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:4.0.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MESSAGE_MAX_BYTES: 104857600

  # Receives the backend's logs, traces and metrics (OTLP on 4318), same as tf_docker/main.tf.
  # Without it the backend logs a connection error every 10 seconds. Grafana UI: http://localhost:3080
  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    ports: ["3080:3000", "4317:4317", "4318:4318"]

  # Optional: comment out if you run `stripe listen` directly on your machine instead.
  # The webhook signing secret it prints must go into STRIPE_WEBHOOK_SECRET in backend/.env.
  stripe-cli:
    image: stripe/stripe-cli:latest
    # Current Stripe CLI versions require the event list; these are the events the backend handles
    command: >-
      listen --forward-to host.docker.internal:8080/api/webhooks/stripe
      --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,customer.subscription.paused,customer.subscription.resumed,invoice.paid,invoice.payment_failed,charge.refunded,charge.dispute.created,charge.dispute.updated,charge.dispute.closed,radar.early_fraud_warning.created
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  postgres_data:
