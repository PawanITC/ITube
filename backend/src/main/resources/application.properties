spring.application.name=ITubeBackend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/itube}
spring.datasource.username=${DATABASE_USERNAME:itube}
spring.datasource.password=${DATABASE_PASSWORD:itube-dev-password}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=501MB

management.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.otlp.metrics.export.step=10s
management.opentelemetry.tracing.export.schedule-delay=10s
management.opentelemetry.logging.export.schedule-delay=10s

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.session.timeout=30m

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=itube-video-transcoders
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka messages carry ids and object storage keys only, never media bytes, so default size limits apply
itube.video.transcode-topic=video.transcode
itube.video.deleted-topic=video.deleted
itube.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}

# --- Object storage (video files, renditions, thumbnails) --------------------
# S3 API: SeaweedFS locally (docker compose), AWS S3 / R2 / GCS interop in production. Postgres keeps only keys.
itube.storage.type=${STORAGE_TYPE:s3}
itube.storage.bucket=${STORAGE_BUCKET:itube-media}
itube.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:8333}
# Host the browser is redirected to (a CDN in production). Blank = same as endpoint.
itube.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:}
itube.storage.region=${STORAGE_REGION:us-east-1}
# Blank = AWS default credential chain (pod/instance role). SeaweedFS dev defaults below.
itube.storage.access-key=${STORAGE_ACCESS_KEY:itube}
itube.storage.secret-key=${STORAGE_SECRET_KEY:itube-dev-password}
# SeaweedFS needs path-style URLs; AWS S3 works with either
itube.storage.path-style=${STORAGE_PATH_STYLE:true}
itube.storage.create-bucket=${STORAGE_CREATE_BUCKET:true}
# Viewers are redirected to a pre-signed URL valid this long, so video bytes never pass through the backend
itube.storage.presign-ttl=PT6H
itube.storage.redirect-playback=true
# Browsers PUT upload parts straight to the bucket. Applied to buckets the backend creates (local SeaweedFS);
# the AWS bucket's CORS is in deploy/terraform/storage.tf.
itube.storage.cors-allowed-origins=${STORAGE_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Resumable uploads -------------------------------------------------------
# Browsers send videos as parts straight to object storage; an unfinished upload can be resumed until it expires.
# upload-ttl must not exceed the bucket's abort-incomplete-multipart-upload rule (7 days, deploy/terraform/storage.tf).
itube.upload.max-file-size=20GB
itube.upload.upload-ttl=P7D
itube.upload.part-url-ttl=PT1H
itube.upload.max-open-uploads=10

# --- Engagement store: ScyllaDB (watch history, likes, comments) --------------
itube.engagement.store=${ENGAGEMENT_STORE:scylla}
itube.scylla.contact-points=${SCYLLA_CONTACT_POINTS:localhost:9042}
itube.scylla.local-datacenter=${SCYLLA_LOCAL_DATACENTER:datacenter1}
itube.scylla.keyspace=${SCYLLA_KEYSPACE:itube_engagement}
# Used only when the keyspace is first created. Production (env ITUBE_SCYLLA_REPLICATION):
# {'class': 'NetworkTopologyStrategy', 'replication_factor': 3}
itube.scylla.replication={'class': 'NetworkTopologyStrategy', 'replication_factor': 1}
itube.scylla.username=${SCYLLA_USERNAME:}
itube.scylla.password=${SCYLLA_PASSWORD:}
itube.scylla.create-schema=${SCYLLA_CREATE_SCHEMA:true}

# One-time copy of pre-split data: video bytes in Postgres -> object storage, and the old
# history/likes/comments tables -> ScyllaDB. Safe to leave on; it does nothing once finished.
itube.migration.legacy-data=${LEGACY_DATA_MIGRATION:true}

# Render ResponseStatusException reasons as RFC 9457 problem details ({"detail": ...}); the frontend reads `detail`
spring.mvc.problemdetails.enabled=true
# One Postgres schema per domain (identity, catalog, payments) with no foreign keys or joins between them,
# so each can move to its own database later. Engagement data is in ScyllaDB, not here.
spring.sql.init.schema-locations=classpath:schema-migrate.sql,classpath:schema-identity.sql,classpath:schema-catalog.sql,classpath:schema-payments.sql

# --- Stripe / payments -------------------------------------------------------
# Local development: put secrets in backend/.env (git-ignored), see backend/.env.example.
spring.config.import=optional:file:.env[.properties]
itube.stripe.secret-key=${STRIPE_SECRET_KEY:}
itube.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
itube.stripe.webhook-max-attempts=8
itube.stripe.webhook-retention=P30D
# Development aid: return Stripe's own error reason to the browser. Ignored with a live key.
itube.stripe.detailed-errors=${STRIPE_DETAILED_ERRORS:false}

itube.payments.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
itube.payments.currency=gbp
# "Digital Audio Visual Works - streamed - subscription". Confirm with your accountant before going live.
itube.payments.membership-tax-code=${MEMBERSHIP_TAX_CODE:txcd_10402200}
# Platform commission in basis points (100 = 1%). Business decision: deliberately 0 until agreed.
itube.payments.platform-fee-bps=${PLATFORM_FEE_BPS:0}
# Stripe Managed Payments (Stripe as merchant of record). Off: iTube is the merchant of record and will pay
# creators through Connect, which Managed Payments doesn't support. Overrides the account's Dashboard default.
itube.payments.managed-payments=${STRIPE_MANAGED_PAYMENTS:false}
# Refuse to start with an sk_live_/rk_live_ key unless this is explicitly enabled
itube.payments.allow-live-mode=${STRIPE_ALLOW_LIVE_MODE:false}
itube.payments.memberships.min-price-minor=99
itube.payments.memberships.max-price-minor=49999
itube.payments.memberships.max-tiers-per-channel=6
itube.payments.memberships.past-due-access=true
itube.payments.memberships.access-grace=PT24H
itube.payments.rate-limit.max-requests=10
itube.payments.rate-limit.window=PT10M

# Members-only playback tokens. Set PLAYBACK_SIGNING_KEY (32+ random bytes, base64) in every shared environment;
# if unset a random key is generated at startup, which invalidates tokens on restart and across instances.
itube.playback.signing-key=${PLAYBACK_SIGNING_KEY:}
itube.playback.token-ttl=PT10M
# Tokens last token-ttl plus the video's length (it streams in many range requests), never longer than this
itube.playback.max-token-ttl=PT6H

itube.memberships.activated-topic=membership.activated
itube.memberships.expired-topic=membership.expired
itube.memberships.tier-changed-topic=membership.tier-changed

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# --- API documentation (springdoc) -------------------------------------------
# Spec generated from the controllers: /v3/api-docs (JSON), UI: /swagger-ui.html
# Set API_DOCS_ENABLED=false in production so the API surface isn't published.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.paths-to-match=/api/**
