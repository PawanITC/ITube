spring.application.name=ITubeBackend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/itube}
spring.datasource.username=${DATABASE_USERNAME:itube}
spring.datasource.password=${DATABASE_PASSWORD:itube-dev-password}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=501MB

management.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.otlp.metrics.export.step=10s
management.opentelemetry.tracing.export.schedule-delay=10s
management.opentelemetry.logging.export.schedule-delay=10s

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.session.timeout=30m