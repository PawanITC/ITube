spring.application.name=ITubeBackend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/itube}
spring.datasource.username=${DATABASE_USERNAME:itube}
spring.datasource.password=${DATABASE_PASSWORD:itube-dev-password}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=501MB

management.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.otlp.metrics.export.step=10s
management.opentelemetry.tracing.export.schedule-delay=10s
management.opentelemetry.logging.export.schedule-delay=10s

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.session.timeout=30m

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=itube-video-transcoders
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Renditions are sent as base64 JSON, so allow records up to 100MB (buffer must be larger than one record)
spring.kafka.producer.properties.max.request.size=104857600
spring.kafka.producer.buffer-memory=268435456
itube.video.transcode-topic=video.transcode
itube.video.rendition-topic=video.rendition
itube.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}

# Render ResponseStatusException reasons as RFC 9457 problem details ({"detail": ...}); the frontend reads `detail`
spring.mvc.problemdetails.enabled=true
spring.sql.init.schema-locations=classpath:schema.sql,classpath:schema-payments.sql

# --- Stripe / payments -------------------------------------------------------
# Local development: put secrets in backend/.env (git-ignored), see backend/.env.example.
spring.config.import=optional:file:.env[.properties]
itube.stripe.secret-key=${STRIPE_SECRET_KEY:}
itube.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
itube.stripe.webhook-max-attempts=8
itube.stripe.webhook-retention=P30D

itube.payments.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
itube.payments.currency=gbp
# "Digital Audio Visual Works - streamed - subscription". Confirm with your accountant before going live.
itube.payments.membership-tax-code=${MEMBERSHIP_TAX_CODE:txcd_10402200}
# Platform commission in basis points (100 = 1%). Business decision: deliberately 0 until agreed.
itube.payments.platform-fee-bps=${PLATFORM_FEE_BPS:0}
# Stripe Managed Payments (Stripe as merchant of record). Off: iTube is the merchant of record and will pay
# creators through Connect, which Managed Payments doesn't support. Overrides the account's Dashboard default.
itube.payments.managed-payments=${STRIPE_MANAGED_PAYMENTS:false}
# Refuse to start with an sk_live_/rk_live_ key unless this is explicitly enabled
itube.payments.allow-live-mode=${STRIPE_ALLOW_LIVE_MODE:false}
itube.payments.memberships.min-price-minor=99
itube.payments.memberships.max-price-minor=49999
itube.payments.memberships.max-tiers-per-channel=6
itube.payments.memberships.past-due-access=true
itube.payments.memberships.access-grace=PT24H
itube.payments.rate-limit.max-requests=10
itube.payments.rate-limit.window=PT10M

# Members-only playback tokens. Set PLAYBACK_SIGNING_KEY (32+ random bytes, base64) in every shared environment;
# if unset a random key is generated at startup, which invalidates tokens on restart and across instances.
itube.playback.signing-key=${PLAYBACK_SIGNING_KEY:}
itube.playback.token-ttl=PT10M
# Tokens last token-ttl plus the video's length (it streams in many range requests), never longer than this
itube.playback.max-token-ttl=PT6H

itube.memberships.activated-topic=membership.activated
itube.memberships.expired-topic=membership.expired
itube.memberships.tier-changed-topic=membership.tier-changed

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# --- API documentation (springdoc) -------------------------------------------
# Spec generated from the controllers: /v3/api-docs (JSON), UI: /swagger-ui.html
# Set API_DOCS_ENABLED=false in production so the API surface isn't published.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.paths-to-match=/api/**
