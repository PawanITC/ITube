# Temporary local database. Data is lost when the application stops.
spring.datasource.url=jdbc:h2:mem:itube;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
# Create the identity/catalog/payments schemas the entities are mapped to
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
# No SeaweedFS, ScyllaDB or legacy data here: files go to a temp folder, engagement data stays in memory
itube.storage.type=local
itube.engagement.store=memory
itube.migration.legacy-data=false
