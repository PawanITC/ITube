# Settings shared by every ITube service. Loaded with the LOWEST precedence (ITubeBackend.common.ItubeDefaults),
# so a service's application.properties, environment variables and -D/-- arguments override anything here.

# --- HTTP server --------------------------------------------------------------
# Virtual threads (Java 21): a request waiting on the database or another service no longer holds an OS
# thread, so one pod handles thousands of concurrent requests. Bulkheads (below) still cap calls per downstream.
spring.threads.virtual.enabled=true
# Finish in-flight requests on SIGTERM (rolling deploys, autoscaling down) instead of cutting them off
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Render ResponseStatusException reasons as RFC 9457 problem details ({"detail": ...}); the frontend reads `detail`
spring.mvc.problemdetails.enabled=true
server.servlet.session.cookie.same-site=lax

# Load shedding (ITubeBackend.common.web.LoadShedding): past this many requests in flight a pod answers 503 at once
# instead of slowing every request down; the gateway then retries another pod and the autoscaler adds pods.
itube.load-shedding.max-concurrent-requests=200
itube.load-shedding.queue-timeout-ms=50

# --- Sessions: shared by all services through Redis ---------------------------
# Every service reads the same SESSION cookie from the same Redis, so signing in once (identity-service)
# signs you in everywhere. The session only holds ids (userId, channelId) and a display name.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.session.timeout=30m

# --- Databases (services that have one) -----------------------------------------------
# Fail fast instead of queueing forever when the pool is exhausted: a quick 503 lets the caller retry elsewhere
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.maximum-pool-size=20
# No lazy loading in views: a connection is held only for the length of a transaction (required for sharding)
spring.jpa.open-in-view=false

# --- Kafka ----------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# No duplicates from producer retries
spring.kafka.producer.properties.enable.idempotence=true
# If Kafka is unreachable, give up on a send after 5 s instead of holding the request thread for 60 s
spring.kafka.producer.properties.max.block.ms=5000
# Kafka messages carry ids and object storage keys only, never media bytes, so default size limits apply
itube.topics.video-transcode=video.transcode
itube.topics.video-transcoded=video.transcoded
itube.topics.video-deleted=video.deleted
itube.topics.account-created=account.created
itube.topics.catalog-cache-invalidation=catalog.cache-invalidation
itube.topics.membership-activated=membership.activated
itube.topics.membership-expired=membership.expired
itube.topics.membership-tier-changed=membership.tier-changed
# Partitions decide how many consumer instances can work in parallel (one partition per consumer at most)
itube.topics.partitions=6
itube.topics.replicas=1
# Failed messages: retried with exponential backoff, then parked on <topic>-dlt for inspection and replay
itube.kafka.retry.max-attempts=5
itube.kafka.retry.initial-interval=500ms
itube.kafka.retry.max-interval=10s

# --- Service-to-service calls ---------------------------------------------------
# Plain HTTP inside the cluster (Kubernetes Services). /internal/** is never routed by the gateway.
itube.services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8081}
itube.services.catalog.url=${CATALOG_SERVICE_URL:http://localhost:8082}
itube.services.engagement.url=${ENGAGEMENT_SERVICE_URL:http://localhost:8083}
itube.services.payments.url=${PAYMENTS_SERVICE_URL:http://localhost:8084}
# Shared secret sent on /internal/** calls and checked by every service. Blank = not checked (local dev only).
itube.internal.token=${INTERNAL_API_TOKEN:}

# Resilience4j, applied to every downstream (ITubeBackend.common.client.Downstream)
#   timeouts: a slow dependency must not hold our threads; fail fast and fall back
itube.resilience.connect-timeout=1s
itube.resilience.read-timeout=2s
#   retry: only transient failures (I/O errors, 5xx), with exponential backoff and jitter
itube.resilience.retry.max-attempts=3
itube.resilience.retry.initial-interval=100ms
#   circuit breaker: after >=50% of the last 20 calls failed (or took >2s), stop calling for 10s
itube.resilience.circuit-breaker.failure-rate-threshold=50
itube.resilience.circuit-breaker.slow-call-duration-threshold=2s
itube.resilience.circuit-breaker.sliding-window-size=20
itube.resilience.circuit-breaker.minimum-number-of-calls=10
itube.resilience.circuit-breaker.wait-duration-in-open-state=10s
#   bulkhead: at most this many concurrent calls per downstream; extra calls fail at once instead of piling up
itube.resilience.bulkhead.max-concurrent-calls=100

# --- Caffeine (in-process caches) ----------------------------------------------
# name=Caffeine spec. Caches exist only in the service that uses them. Entries also expire on their own, so a
# missed invalidation self-heals within the TTL.
itube.cache.specs.remote-video-summary=maximumSize=100000,expireAfterWrite=30s,recordStats
itube.cache.specs.remote-video-access=maximumSize=100000,expireAfterWrite=15s,recordStats
itube.cache.specs.remote-channel=maximumSize=50000,expireAfterWrite=60s,recordStats
itube.cache.specs.remote-account=maximumSize=50000,expireAfterWrite=5m,recordStats
itube.cache.specs.remote-entitlement=maximumSize=100000,expireAfterWrite=20s,recordStats

# --- Observability --------------------------------------------------------------
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.otlp.metrics.export.step=10s
management.opentelemetry.tracing.export.schedule-delay=10s
management.opentelemetry.logging.export.schedule-delay=10s
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
# /actuator/health/liveness and /readiness for Kubernetes probes
management.endpoint.health.probes.enabled=true
# Kubernetes must not restart a pod just because a dependency is down; readiness takes it out of the Service
management.endpoint.health.group.liveness.include=livenessState
management.health.redis.enabled=true

# --- API documentation (springdoc) ------------------------------------------------
# Spec generated from the controllers: /v3/api-docs (JSON), UI: /swagger-ui.html (per service).
# Set API_DOCS_ENABLED=false in production so the API surface isn't published.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.paths-to-match=/api/**
