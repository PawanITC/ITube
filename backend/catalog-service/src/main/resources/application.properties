# catalog-service: channels, subscriptions, videos, uploads, playback. Shared settings: itube-defaults.properties.
spring.application.name=catalog-service
server.port=${PORT:8082}
spring.config.import=optional:file:.env[.properties]
# The legacy multipart upload endpoint (POST /api/videos); resumable uploads go straight to object storage instead
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=501MB

# --- Sharded catalog database ----------------------------------------------------
# Channels and videos are spread over several PostgreSQL databases by creator (docs/SHARDING.md).
# shards[0] MUST be the original database: rows from before sharding live there.
itube.sharding.shards[0].url=${CATALOG_SHARD_0_URL:${DATABASE_URL:jdbc:postgresql://localhost:5434/itube}}
itube.sharding.shards[0].username=${DATABASE_USERNAME:itube}
itube.sharding.shards[0].password=${DATABASE_PASSWORD:itube-dev-password}
itube.sharding.shards[1].url=${CATALOG_SHARD_1_URL:jdbc:postgresql://localhost:5435/itube}
itube.sharding.shards[1].username=${CATALOG_SHARD_1_USERNAME:${DATABASE_USERNAME:itube}}
itube.sharding.shards[1].password=${CATALOG_SHARD_1_PASSWORD:${DATABASE_PASSWORD:itube-dev-password}}
# A home page or search waits at most this long for each shard, then answers with the shards that replied
itube.sharding.scatter-timeout=2s
itube.sharding.maximum-pool-size=20
# Records the shard of creators from before sharding; can be switched off once every environment has run it
itube.sharding.backfill-directory=true
# The schema is applied per shard by ShardedDataSourceConfig, not by Spring's single-database initializer
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate

# --- Caffeine caches (see CatalogCaches) -------------------------------------------
itube.cache.specs.video-access=maximumSize=200000,expireAfterWrite=30s,recordStats
itube.cache.specs.video-media=maximumSize=200000,expireAfterWrite=60s,recordStats
itube.cache.specs.video-row=maximumSize=200000,expireAfterWrite=30s,recordStats
itube.cache.specs.feed=maximumSize=200,expireAfterWrite=10s,recordStats
itube.cache.specs.channel=maximumSize=100000,expireAfterWrite=5m,recordStats
itube.cache.specs.video-ads=maximumSize=200000,expireAfterWrite=30s,recordStats
itube.cache.specs.ad-pool=maximumSize=1,expireAfterWrite=30s,recordStats
# Shard directory entries never change, so they can be kept for long
itube.cache.specs.owner-shard=maximumSize=1000000,expireAfterWrite=1h,recordStats

# --- Object storage (video files, renditions, thumbnails) --------------------
# S3 API: SeaweedFS locally (docker compose), AWS S3 in production. Postgres keeps only keys.
itube.storage.type=${STORAGE_TYPE:s3}
itube.storage.bucket=${STORAGE_BUCKET:itube-media}
itube.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:8333}
# Host the browser is redirected to by pre-signed URLs. Blank = same as endpoint.
itube.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:}
itube.storage.region=${STORAGE_REGION:us-east-1}
# Blank = AWS default credential chain (pod/instance role). SeaweedFS dev defaults below.
itube.storage.access-key=${STORAGE_ACCESS_KEY:itube}
itube.storage.secret-key=${STORAGE_SECRET_KEY:itube-dev-password}
# SeaweedFS needs path-style URLs; AWS S3 works with either
itube.storage.path-style=${STORAGE_PATH_STYLE:true}
itube.storage.create-bucket=${STORAGE_CREATE_BUCKET:true}
# Viewers are redirected to a pre-signed URL valid this long, so video bytes never pass through the backend
itube.storage.presign-ttl=PT6H
itube.storage.redirect-playback=${STORAGE_REDIRECT_PLAYBACK:true}
# Browsers PUT upload parts straight to the bucket. Applied to buckets the backend creates (local SeaweedFS);
# the AWS bucket's CORS is in deploy/terraform/storage.tf.
itube.storage.cors-allowed-origins=${STORAGE_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- CDN for public media (Cloudflare; docs/CDN-AND-DNS.md) -----------------------
# Blank = no CDN: viewers get pre-signed storage URLs as before. Example: https://media.itube.example.com
itube.cdn.media-base-url=${CDN_MEDIA_BASE_URL:}
# Thumbnails always use the CDN when it is set. Video files only with this on: check your CDN plan's terms first.
itube.cdn.serve-video=${CDN_SERVE_VIDEO:false}

# --- Resumable uploads -------------------------------------------------------
# Browsers send videos as parts straight to object storage; an unfinished upload can be resumed until it expires.
# upload-ttl must not exceed the bucket's abort-incomplete-multipart-upload rule (7 days, deploy/terraform/storage.tf).
itube.upload.max-file-size=20GB
itube.upload.upload-ttl=P7D
itube.upload.part-url-ttl=PT1H
itube.upload.max-open-uploads=10

# --- Transcoding (done by transcode-worker; see TranscodeSweeper) ------------------
itube.transcode.stuck-after=PT30M
itube.transcode.max-attempts=5
itube.transcode.sweep-interval=PT5M

# Members-only playback tokens. Set PLAYBACK_SIGNING_KEY (32+ random bytes, base64) in every shared environment;
# if unset a random key is generated at startup, which invalidates tokens on restart and across instances.
itube.playback.signing-key=${PLAYBACK_SIGNING_KEY:}
itube.playback.token-ttl=PT10M
# Tokens last token-ttl plus the video's length (it streams in many range requests), never longer than this
itube.playback.max-token-ttl=PT6H

# One-time move of pre-split video bytes from Postgres to object storage. Does nothing once finished.
itube.migration.legacy-data=${LEGACY_DATA_MIGRATION:true}
