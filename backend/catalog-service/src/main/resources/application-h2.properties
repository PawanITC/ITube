# Tests: two in-memory H2 databases as two catalog shards, so every test exercises the sharding code.
itube.sharding.shards[0].url=jdbc:h2:mem:catalog0;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
itube.sharding.shards[0].username=sa
itube.sharding.shards[0].password=
itube.sharding.shards[1].url=jdbc:h2:mem:catalog1;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
itube.sharding.shards[1].username=sa
itube.sharding.shards[1].password=
spring.jpa.hibernate.ddl-auto=none
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
# No broker in tests: fail sends at once instead of waiting a minute for one
spring.kafka.producer.properties.max.block.ms=1
itube.storage.type=local
itube.migration.legacy-data=false
management.otlp.metrics.export.enabled=false
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
# No Redis in tests: plain in-memory HTTP sessions instead of the shared Redis-backed ones
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
management.health.redis.enabled=false
