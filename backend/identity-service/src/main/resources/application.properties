# identity-service: accounts, register/login/logout, access and refresh tokens, Cognito sign-in. Shared settings: itube-defaults.properties (itube-common).
spring.application.name=identity-service
server.port=${PORT:8081}
# Local development secrets (git-ignored), relative to the directory the service is started from (backend/)
spring.config.import=optional:file:.env[.properties]

# Postgres schema "identity". Each service owns its schema; nothing joins across them, so this can move to its own
# database by changing the URL.
spring.datasource.url=${IDENTITY_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5434/itube}}
spring.datasource.username=${DATABASE_USERNAME:itube}
spring.datasource.password=${DATABASE_PASSWORD:itube-dev-password}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema-identity.sql
spring.jpa.hibernate.ddl-auto=validate

# Password hashing (BCrypt) is deliberately slow, about 0.1 s of CPU per sign-in. Few concurrent requests per pod keep
# each one fast; extra sign-ins are refused with 503 + Retry-After and the gateway tries another pod.
itube.load-shedding.max-concurrent-requests=32

# --- Tokens (docs/AUTH.md) ------------------------------------------------------
# RSA key that signs access tokens, PKCS#8 PEM. Blank = a temporary key (one local process only).
# Kubernetes: Secret itube-secrets/jwt-private-key, and JWT_REQUIRE_CONFIGURED_KEY=true so a missing key fails fast.
itube.auth.jwt.private-key=${JWT_PRIVATE_KEY:}
itube.auth.jwt.previous-public-key=${JWT_PREVIOUS_PUBLIC_KEY:}
itube.auth.jwt.require-configured-key=${JWT_REQUIRE_CONFIGURED_KEY:false}
# identity-service verifies with its own keys; it doesn't fetch its own JWKS
itube.auth.jwt.jwks-uri=

# --- Sign in with Amazon Cognito (managed login, OAuth 2.0 code flow + PKCE) -------
# Values: `terraform output` in deploy/terraform (cognito_*). Off until COGNITO_ENABLED=true and all are set.
itube.auth.cognito.enabled=${COGNITO_ENABLED:false}
itube.auth.cognito.region=${COGNITO_REGION:eu-west-2}
itube.auth.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
itube.auth.cognito.client-id=${COGNITO_CLIENT_ID:}
itube.auth.cognito.client-secret=${COGNITO_CLIENT_SECRET:}
itube.auth.cognito.domain=${COGNITO_DOMAIN:}
itube.auth.cognito.redirect-uri=${COGNITO_REDIRECT_URI:${FRONTEND_BASE_URL:http://localhost:3000}/api/auth/oauth/cognito/callback}
itube.auth.cognito.post-login-redirect=${FRONTEND_BASE_URL:http://localhost:3000}/
itube.auth.cognito.error-redirect=${FRONTEND_BASE_URL:http://localhost:3000}/login
# Optional: go straight to one identity provider configured in the pool (e.g. Google)
itube.auth.cognito.identity-provider=${COGNITO_IDENTITY_PROVIDER:}
