# transcode-worker: FFmpeg renditions driven by Kafka. Shared settings: itube-defaults.properties (itube-common).
spring.application.name=transcode-worker
server.port=${PORT:8085}
spring.config.import=optional:file:.env[.properties]
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

itube.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}

# One video at a time per consumer, and allow up to ~2 hours between polls: without this, a long transcode makes
# Kafka think the worker died (default 5 min), hand the video to another worker, and transcode it twice.
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.properties.max.poll.interval.ms=7500000
spring.kafka.listener.concurrency=1

# Same object storage settings as catalog-service (it reads sources and writes renditions)
itube.storage.type=${STORAGE_TYPE:s3}
itube.storage.bucket=${STORAGE_BUCKET:itube-media}
itube.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:8333}
itube.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:}
itube.storage.region=${STORAGE_REGION:us-east-1}
itube.storage.access-key=${STORAGE_ACCESS_KEY:itube}
itube.storage.secret-key=${STORAGE_SECRET_KEY:itube-dev-password}
itube.storage.path-style=${STORAGE_PATH_STYLE:true}
# catalog-service creates the local bucket
itube.storage.create-bucket=false
