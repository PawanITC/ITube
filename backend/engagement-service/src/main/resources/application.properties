# engagement-service: watch history, likes, comments. Shared settings: itube-defaults.properties (itube-common).
spring.application.name=engagement-service
server.port=${PORT:8083}
itube.engagement.kafka.topic=${ENGAGEMENT_KAFKA_TOPIC:engagement.commands.v1}
itube.engagement.kafka.concurrency=${ENGAGEMENT_KAFKA_CONCURRENCY:3}
spring.config.import=optional:file:.env[.properties]

# --- ScyllaDB (keyspace itube_engagement) ---------------------------------------
# Scylla shards by itself: every table is partitioned by user or video id and spread over the nodes by a
# consistent-hash ring, so adding nodes adds capacity. Every read here touches exactly one partition.
itube.engagement.store=${ENGAGEMENT_STORE:scylla}
itube.scylla.contact-points=${SCYLLA_CONTACT_POINTS:localhost:9042}
itube.scylla.local-datacenter=${SCYLLA_LOCAL_DATACENTER:datacenter1}
itube.scylla.keyspace=${SCYLLA_KEYSPACE:itube_engagement}
# Used only when the keyspace is first created. Production (env ITUBE_SCYLLA_REPLICATION):
# {'class': 'NetworkTopologyStrategy', 'replication_factor': 3}
itube.scylla.replication={'class': 'NetworkTopologyStrategy', 'replication_factor': 1}
itube.scylla.username=${SCYLLA_USERNAME:}
itube.scylla.password=${SCYLLA_PASSWORD:}
itube.scylla.create-schema=${SCYLLA_CREATE_SCHEMA:true}

# One-time copy of the pre-split history/likes/comments tables (Postgres legacy_engagement.*) into ScyllaDB.
# Safe to leave on: it does nothing once the tables are renamed *_copied.
itube.migration.legacy-data=${LEGACY_DATA_MIGRATION:true}
itube.migration.legacy-datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/itube}
itube.migration.legacy-datasource.username=${DATABASE_USERNAME:itube}
itube.migration.legacy-datasource.password=${DATABASE_PASSWORD:itube-dev-password}
