# Opt-in deployed profile: SPRING_PROFILES_ACTIVE=msk. Local defaults stay in application.properties/common.
# Required: private SASL/IAM bootstrap servers from the Terraform MSK output; no local-broker fallback.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Shared properties reach the producer, BOTH consumers (commands and Catalog cleanup), and KafkaAdmin.
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=AWS_MSK_IAM
spring.kafka.properties.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
spring.kafka.properties.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
spring.kafka.properties.ssl.endpoint.identification.algorithm=https
# Reduce reconnect bursts on small MSK brokers without changing event retries or acknowledgments.
spring.kafka.properties.reconnect.backoff.ms=1000
spring.kafka.properties.reconnect.backoff.max.ms=10000
spring.kafka.admin.fail-fast=true

# Only MSK has two brokers. The deployment explicitly overrides the shared in-cluster value of 1 too.
itube.topics.replicas=2

# Credentials come from the EKS Pod Identity agent via the AWS SDK default credential provider chain.
# Keep topic names, consumer groups, serializers, acks and ordering unchanged.
