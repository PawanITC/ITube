# Local development infrastructure: PostgreSQL, ScyllaDB, SeaweedFS (S3 object storage), Redis, Kafka,
# Grafana (logs/traces/metrics) and the Stripe CLI webhook forwarder. Same ports and credentials the backend expects by default.
#
# Easiest: run dev.cmd (Windows) from the repo root, which starts this plus the backend and frontend.
# By hand:
#   docker compose --env-file backend/.env up -d
#   docker compose logs stripe-cli        # prints the whsec_... secret for STRIPE_WEBHOOK_SECRET
#   docker compose down                   # stop (add -v to also wipe the databases and stored videos)
#
# --env-file lets Compose read STRIPE_SECRET_KEY from backend/.env (git-ignored, never committed).
# tf_docker/ (Terraform) starts the same services on the same ports; use one or the other, not both.
name: itube

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: itube
      POSTGRES_USER: itube
      POSTGRES_PASSWORD: itube-dev-password
    ports: ["5434:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  # Engagement data: watch history, likes, comments (backend/src/main/resources/scylla/engagement.cql).
  # Developer mode on one CPU shard. broadcast-rpc-address tells the driver to reconnect via localhost
  # instead of the container's internal IP, which isn't reachable from Windows/macOS.
  scylla:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1 --rpc-address 0.0.0.0 --broadcast-rpc-address 127.0.0.1
    ports: ["9042:9042"]
    volumes: [scylla_data:/var/lib/scylla]

  # SeaweedFS: S3-compatible storage for video files, renditions and thumbnails (S3 API on 8333).
  # The backend creates the bucket. Browsers play videos straight from here via pre-signed URLs.
  # The AWS_* variables are SeaweedFS's admin S3 credentials; they match the backend's defaults.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: itube
      AWS_SECRET_ACCESS_KEY: itube-dev-password
    ports: ["8333:8333"]
    volumes: [seaweedfs_data:/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:4.0.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # Receives the backend's logs, traces and metrics (OTLP on 4318), same as tf_docker/main.tf.
  # Without it the backend logs a connection error every 10 seconds. Grafana UI: http://localhost:3080
  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    ports: ["3080:3000", "4317:4317", "4318:4318"]

  # Optional: comment out if you run `stripe listen` directly on your machine instead.
  # The webhook signing secret it prints must go into STRIPE_WEBHOOK_SECRET in backend/.env.
  stripe-cli:
    image: stripe/stripe-cli:latest
    # Current Stripe CLI versions require the event list; these are the events the backend handles
    command: >-
      listen --forward-to host.docker.internal:8080/api/webhooks/stripe
      --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,customer.subscription.paused,customer.subscription.resumed,invoice.paid,invoice.payment_failed,charge.refunded,charge.dispute.created,charge.dispute.updated,charge.dispute.closed,radar.early_fraud_warning.created
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  postgres_data:
  scylla_data:
  seaweedfs_data:
